<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Avaliação contínua: Aula 070</title>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


    <!-- ==================================================
         MENU
    ================================================== -->

    <nav class="navbar">

        <div class="navbar-content">

            <a
                href="{{ url_for('index') }}"
                class="navbar-title"
            >
                Avaliação contínua:
                <strong>Aula 070</strong>
            </a>


            <a
                href="{{ url_for('index') }}"
                class="navbar-link"
            >
                Home
            </a>


            <a
                href="{{ url_for('emails_enviados') }}"
                class="navbar-link"
            >
                E-mails enviados
            </a>

        </div>

    </nav>


    <!-- ==================================================
         CONTEÚDO
    ================================================== -->

    <main class="content">


        <!-- ==================================================
             MENSAGENS DO FLASK
        ================================================== -->

        {% with mensagens = get_flashed_messages(with_categories=true) %}

            {% if mensagens %}

                {% for categoria, mensagem in mensagens %}

                    <div
                        class="alert
                        {% if categoria == 'success' %}
                            alert-sucesso
                        {% else %}
                            alert-erro
                        {% endif %}"
                    >

                        {{ mensagem }}

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- ==================================================
             CONTEÚDO DAS PÁGINAS
        ================================================== -->

        {% block content %}
        {% endblock %}


    </main>


</body>

</html>
