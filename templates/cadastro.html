<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Cadastro de usuário</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div class="container mt-5">

    <h1>Cadastro de usuário</h1>

    <hr>

    {% if mensagem %}
        <div class="alert alert-info">
            {{ mensagem }}
        </div>
    {% endif %}

    <form method="POST">

        <div class="mb-3">

            <label class="form-label">
                Usuário
            </label>

            <input
                type="text"
                name="usuario"
                class="form-control"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Senha
            </label>

            <input
                type="password"
                name="senha"
                class="form-control"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Função
            </label>

            <select
                name="funcao"
                class="form-select"
                required
            >

                <option value="User">
                    User
                </option>

                <option value="Administrador">
                    Administrador
                </option>

            </select>

        </div>


        <button
            type="submit"
            class="btn btn-primary"
        >
            Cadastrar
        </button>

    </form>

    <br>

    <a href="/">
        Voltar para página inicial
    </a>

</div>

</body>

</html>
