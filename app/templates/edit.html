{% extends "base.html" %}
{% block title %}Editar usuário - Aula 080{% endblock %}
{% block content %}
<h1>Editar usuário</h1>
<p>Altere os dados abaixo. Deixe a senha em branco para manter a senha atual.</p>
<form method="post" class="user-form">
  <label for="name">Nome completo</label>
  <input id="name" name="name" value="{{ user.name }}" required>
  <label for="username">Nome do usuário</label>
  <input id="username" name="username" value="{{ user.username }}" required>
  <label for="email">E-mail</label>
  <input id="email" name="email" type="email" value="{{ user.email }}" required>
  <label for="password">Nova senha (opcional)</label>
  <input id="password" name="password" type="password">
  <label for="role">Função</label>
  <select id="role" name="role">
    <option value="User" {% if user.role == 'User' %}selected{% endif %}>User</option>
    <option value="Admin" {% if user.role == 'Admin' %}selected{% endif %}>Admin</option>
  </select>
  <button class="btn" type="submit">Salvar alterações</button>
  <a class="btn secondary" href="{{ url_for('main.index') }}">Cancelar</a>
</form>
{% endblock %}
